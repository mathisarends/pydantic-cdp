name: Update CDP spec

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --dev

      - name: Run update script
        run: ./scripts/update_cdp_spec.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- cdpify/domains specs; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: uv run pytest tests -v

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update generated client from latest CDP spec"
          branch: bot/update-cdp-spec
          delete-branch: true
          title: "chore: update generated client from latest CDP spec"
          body: |
            Automated weekly refresh of the Chrome DevTools Protocol spec.

            This PR was opened by the `update-cdp-spec` workflow after detecting
            changes in `specs/` and/or `cdpify/domains/` following a re-run of
            `./scripts/update_cdp_spec.sh`.

            Please review the generated diff before merging.
          labels: |
            generated
            automated
